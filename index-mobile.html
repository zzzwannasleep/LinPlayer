<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 是安全区的前提:不写它,env(safe-area-inset-*) 全部返回 0,
         而且**不报错** —— 表现是刘海/挖孔把顶栏标题吃掉一半。
         user-scalable=no:双指缩放在一个全屏媒体应用里只会把版式搞乱,
         而放大文字这件事交给系统字号(rem 会跟着走)。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <!-- 强制深色。手机端不跟随系统主题(见 ui/mobile/README.md 的硬约束):
         浅色主题在一个满屏封面图的应用里没有意义,而两套配色要维护两遍。 -->
    <meta name="color-scheme" content="dark" />
    <!-- ★ 这三处底色必须**逐位一致**,否则每一次交接都闪一下:
           theme-color(系统栏) = #boot 背景 = mobile.css 的 --bg
         上一版 #boot 是 #0b0b0f 而 --bg 是 #0e0e13 —— 差 3 个灰阶,
         在 OLED 上撤场那一瞬间是看得见的一记"暗闪"。 -->
    <meta name="theme-color" content="#0e0e13" />
    <title>LinPlayer</title>
    <!-- ══════════ 启动动画 ══════════
         **内联**在 head 里,不进 CSS 包 —— 它要在样式表和 JS 都还没到达时就能画出来,
         进了包就等于"要等包下完才有动画",那就没意义了。

         谁来撤它:App.tsx 在**会话闸口出结果**那一刻(见那里的 effect)。
         不在 React 挂载时撤:挂载完到会话回来之间还有一段问核层的空窗,
         那段时间撤早了就是一片黑。

         为什么值得做成这样而不是一个转圈:
         首启(还没加过服务器)那一段是**这个应用最慢的一屏** —— 要等 WebView 起来、
         要等 JS 包解析、还要问一次核层有没有会话。用户 2026-08-01 报的
         「点开软件到首次添加页之间很难看」就是这一段没人管。
         这里给的是:底色立刻铺满(接住系统开屏)→ 字标扫光 → 底部一条不定量进度条。
         三样都是纯 CSS,零字节额外请求,首帧就能画。 -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #0e0e13;
        color: #f4f4f8;
        font: 700 26px/1 system-ui, -apple-system, "Noto Sans SC", sans-serif;
        letter-spacing: -0.03em;
        /* 撤场只做一次 220ms 淡出 + 极轻的放大 —— 硬切会在首屏留一记"闪",
           而放大是把"这一层揭开"这件事说出来。 */
        transition:
          opacity 220ms ease,
          transform 220ms ease;
      }
      #boot.off {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }

      /* 字标。扫光用 background-clip:text —— 只动 background-position,
         不重排不重绘布局。 */
      #boot .wm {
        background: linear-gradient(
          100deg,
          #6b6b7c 0%,
          #6b6b7c 36%,
          #f4f4f8 48%,
          #5b8cff 56%,
          #6b6b7c 68%,
          #6b6b7c 100%
        );
        background-size: 280% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: boot-sweep 1700ms ease-in-out infinite;
      }
      @keyframes boot-sweep {
        from {
          background-position: 180% 0;
        }
        to {
          background-position: -80% 0;
        }
      }

      /* 不定量进度条。★ 故意不做成"假百分比" —— 我们并不知道还要多久,
         画一个会走到 90% 卡住的数字比不画更糟。 */
      #boot .bar {
        position: relative;
        width: 132px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      #boot .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #5b8cff, transparent);
        transform: translateX(-100%);
        animation: boot-slide 1300ms cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      @keyframes boot-slide {
        to {
          transform: translateX(100%);
        }
      }

      /* ★ 降级不是"关掉动画就完事":全关掉的话这一屏就是一块纯色 + 一行灰字,
         看起来像卡死了。所以留一次呼吸,只是慢得多。 */
      @media (prefers-reduced-motion: reduce) {
        #boot .wm {
          animation: none;
          color: #f4f4f8;
          background: none;
          -webkit-background-clip: border-box;
          background-clip: border-box;
        }
        #boot .bar::after {
          animation-duration: 3.2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="wm">LinPlayer</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/ui/mobile/main.tsx"></script>
  </body>
</html>
