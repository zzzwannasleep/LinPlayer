# 构建 · Go 核心层 + C# (Avalonia) Windows 外壳
#
# 2026-09-04 重写:Rust/Tauri 栈整体删除后,原来的 build-windows / build-linux /
# build-android 三个 job 连同它们依赖的 cargo / node / tauri 步骤一起没了。
# 现在只有 Windows 一个端 —— Linux 与 Android 的 Go 版 UI 还没写(见
# docs/go-migration/TODO.md 的进度表),没有可构建的东西,所以**不留空 job**:
# 留着的话它们要么恒绿(什么都没干)要么恒红,两种都是噪音。
name: Build

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'apps/windows/**'
      - 'bindings/**'
      - 'scripts/**'
      - 'third_party/**'
      - 'VERSION'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'apps/windows/**'
      - 'bindings/**'
      - 'scripts/**'
      - 'third_party/**'
      - 'VERSION'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(留空则取 VERSION 文件 + -build<run_number>)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # ★ 校验每个 `run:` 块的 shell 语法。yaml 合法 ≠ 脚本合法:
      #   用脚本批量改 workflow 时把某步的 if/then 切断,YAML 照样解析得过,
      #   要等 runner 跑到那一步才报 "syntax error: unexpected end of file"。
      #   本仓已经这样烧过两轮 CI。放在最先跑、最便宜的 job 里:坏了就别开 runner 了。
      - name: Check workflow shell syntax
        run: bash scripts/check-workflows.sh

      # 版本口径见 docs/VERSIONING.md。唯一权威是仓库根的 VERSION 一行。
      # 加 -build<run_number> 是为了让**每次预发布都比上一次大** —— App 的更新
      # 比较逻辑按 major.minor.patch.build 逐级比,不加就永远检测不到新预览版。
      - id: v
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            BASE=$(tr -d '[:space:]' < VERSION)
            V="$BASE-build${{ github.run_number }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version = $V"

  build-windows:
    name: Build Windows portable
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 项目级工具链(Go + zig)。版本与 sha256 钉在 fetch 脚本里 ——
      # 和本地开发用的是**同一份**,免得「我这儿能编、CI 编不过」。
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/fetch-toolchain.sh') }}

      - name: Fetch toolchain (Go + zig)
        shell: bash
        run: bash scripts/fetch-toolchain.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 完整版 libmpv。100MB+,不进仓库(.gitignore),每次构建现拉。
      #
      # 为什么必须是 shinchiro 的完整构建:自带完整 ffmpeg,含 PGS/SUP 图形字幕解码器
      # (hdmv_pgs_subtitle)。精简版 libmpv 能编译、能播放、蓝光字幕一片空白。
      # ★ 这步任何一环失败都必须让 job 红:少了 DLL,exe 照样编得出来、照样打得成包,
      #   用户双击才发现「找不到 libmpv-2.dll」。
      - name: Fetch full libmpv (shinchiro mpv-dev)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $rel = gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-.*\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "shinchiro 最新 release 里没有 mpv-dev-x86_64 资产" }
          Write-Host "source: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev | Out-Null
          $dll = Get-ChildItem mpv-dev -Recurse -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "压缩包里没有 libmpv-2.dll" }
          Copy-Item $dll.FullName third_party/libmpv/libmpv-2.dll -Force
          $size = (Get-Item third_party/libmpv/libmpv-2.dll).Length
          Write-Host "libmpv-2.dll size: $size"
          if ($size -lt 60MB) { throw "libmpv-2.dll 只有 $size 字节,不是完整版" }

      - name: Core gate (go vet / test / FFI 契约 / 差分对账)
        shell: bash
        run: bash scripts/check-core.sh

      - name: Bindings gate (COMMANDS.md ↔ Go ↔ C# ↔ Kotlin)
        shell: bash
        run: bash scripts/check-bindings.sh

      # ★★ 编译期凭据。一个都不配也编得出来 —— 对应功能会**明说「这个构建没配」**,
      #   而不是装作没数据。但发行版这九个全都要配:漏了用户看到的是
      #   「弹幕搜不到 / 排行榜空白 / Trakt 登不上」,而 CI 全绿。
      #   全表与漏配后果见 docs/go-migration/BUILD-SECRETS.md。
      #   scripts/check-workflows.sh 的凭据闸门盯着这一步。
      - name: Pack Windows portable
        shell: bash
        env:
          LP_VERSION: ${{ needs.version.outputs.version }}
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LP_SYNC_PROXY_BASE: ${{ secrets.LP_SYNC_PROXY_BASE }}
          LP_SYNC_PROXY_KEY: ${{ secrets.LP_SYNC_PROXY_KEY }}
          LP_BANGUMI_REDIRECT_URI: ${{ secrets.LP_BANGUMI_REDIRECT_URI }}
          LP_AFDIAN_SPONSOR_URL: ${{ secrets.LP_AFDIAN_SPONSOR_URL }}
          LP_ICON_LIBRARY_SOURCES: ${{ secrets.LP_ICON_LIBRARY_SOURCES }}
          LP_CF_TEST_URL: ${{ secrets.LP_CF_TEST_URL }}
        run: bash scripts/pack-win.sh "$GITHUB_WORKSPACE/release"

      # ★ 出包了不等于包是对的。少一个 DLL 用户双击才发现,而 CI 早就绿了。
      - name: Verify package contents
        shell: bash
        run: |
          STAGE="$GITHUB_WORKSPACE/release/LinPlayer"
          # ★ exe 名是 LinPlayer.exe(csproj 的 AssemblyName),不是项目名
          #   LinPlayer.Desktop.exe —— 写错了这步会红,而它本身就是防漏的那道闸。
          for f in LinPlayer.exe lpcore.dll libmpv-2.dll; do
            if [ ! -f "$STAGE/$f" ]; then
              echo "发行包里缺 $f"
              ls -la "$STAGE" | head -30
              exit 1
            fi
          done
          echo "关键产物齐全:"
          ls -la "$STAGE"/LinPlayer.exe "$STAGE"/lpcore.dll "$STAGE"/libmpv-2.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinPlayer-win-x64
          path: release/*.zip
          if-no-files-found: error

  create-prerelease:
    name: Create Pre-release
    needs: [version, build-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List release artifacts
        run: ls -lah ./artifacts/

      - name: Generate SHA256 checksums
        run: |
          cd ./artifacts
          sha256sum ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}-pre
          name: v${{ needs.version.outputs.version }} (Pre-release)
          prerelease: true
          files: ./artifacts/*
