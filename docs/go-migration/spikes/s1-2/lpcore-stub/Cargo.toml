# SPIKE S1.2 的核心层桩。产物 lpcore.dll,导出 SPEC §5.1 第 3 组(视频通道 B)的 5 个函数。
#
# 为什么是 Rust 不是 Go:本机没有 Go 也没有 C 编译器(go/gcc/clang/cl/zig 全部 command not found,
# 2026-08-31 实测)。C ABI 侧一字不差,Go 核心落地后把 dll 换掉即可,C# 侧一行不用改。
# **这不代表 SPIKE-2(Go 三宿主 FFI)已验** —— 那条仍然是未验的。
#
# [workspace] 空表是故意的:本 crate 在仓库 workspace 目录树内但不是它的成员,
# 不写这行 cargo 会报「current package believes it's in a workspace when it's not」。
[workspace]

[package]
name = "lpcore-stub"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "lpcore"          # -> lpcore.dll,和生产环境的核心库同名,C# 侧 DllImport 不用改
crate-type = ["cdylib"]

[profile.release]
# 性能实验要量 CPU,别让 debug 断言进来
opt-level = 2
