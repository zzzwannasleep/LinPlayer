[package]
name = "linplayer-danmaku-proxy"
version = "0.1.0"
edition = "2021"

# 独立部署件:跑在用户自己的服务器上,和三端客户端**没有**任何代码依赖关系。
# 故意不依赖 linplayer-core —— core 拖着 emby/插件/网盘/图片处理一整套,
# 对一个只干「签名 + 转发 + 缓存」的服务是纯负担(镜像体积、编译时间、攻击面)。
# 唯一需要共享的是那 5 行签名算法,已连同一组测试向量抄进 upstream.rs。

[[bin]]
name = "linplayer-danmaku-proxy"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "fs", "sync"] }
tower-http = { version = "0.6", features = ["limit"] }
# rustls 而非 native-tls:容器里不用装 OpenSSL,scratch/distroless 基础镜像也能跑。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
